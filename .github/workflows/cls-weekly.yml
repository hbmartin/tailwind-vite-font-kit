name: Weekly CLS

# This intentionally follows the reference app's floating HEAD and the pinned Ubuntu image.
# The recorded SHAs, runner image, browser, and package versions make every result attributable.
# Only the six probe/viewport medians gate; the width sweep is diagnostic.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Max median CLS on any gated probe'
        default: '0.02'

permissions:
  contents: write
  issues: write

concurrency:
  group: cls-weekly
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-24.04
    env:
      THRESHOLD: ${{ inputs.threshold || '0.02' }}
      REFERENCE_APP: https://github.com/hbmartin/tailwind-vite-font-kit-example
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job clones, installs and builds a separate repo. A `contents: write`
          # token persisted in .git/config would be readable by every install script and
          # build step that runs; the note step below configures it after all of that.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          # The reference app has a floating install, so the workflow file salts this
          # job's store independently from the hermetic fixture build in ci.yml.
          cache-dependency-path: |
            pnpm-lock.yaml
            .github/workflows/cls-weekly.yml

      - name: Verify runner fallback fonts
        run: |
          for family in 'Liberation Sans' 'Liberation Serif'; do
            match="$(fc-match -f '%{family}\n' "$family")"
            echo "$family -> $match"
            if [[ "$match" != *"$family"* ]]; then
              echo "::error::ubuntu-24.04 does not provide $family; the CLS gate would not exercise the intended local fallback"
              exit 1
            fi
          done

      - name: Install kit
        run: pnpm install --frozen-lockfile

      # The reference app is a real TanStack Start app, so this job also covers the
      # Start-specific surface the fast fixture cannot: route rules, the Link preload
      # header, and SSR. Its HEAD and dependency graph deliberately remain floating.
      - name: Check out the reference app
        run: git clone --depth 1 "$REFERENCE_APP" reference-app

      - name: Point it at this commit of the kit
        working-directory: reference-app
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add -D "link:.."

      - name: Use this commit's measurement harness
        working-directory: reference-app
        run: |
          cp ../harness/sweep.mjs harness/sweep.mjs
          cp ../harness/clswidth.mjs harness/clswidth.mjs

      - name: Install the reference app's browser
        working-directory: reference-app
        run: pnpm exec puppeteer browsers install chrome

      - name: Capture environment
        run: node scripts/collect-cls-environment.mjs reference-app cls-environment.json

      - name: Build and serve
        working-directory: reference-app
        run: |
          pnpm build
          PORT=3210 node .output/server/index.mjs &
          tries=0
          until curl -sf -o /dev/null http://localhost:3210/probe/hero; do
            tries=$((tries + 1))
            if [ "$tries" -ge 30 ]; then
              echo '::error::/probe/hero never responded after 30 attempts — the server did not come up'
              exit 1
            fi
            sleep 1
          done

      - name: Sweep the six gated probes
        working-directory: reference-app
        run: node harness/sweep.mjs --label ci --base http://localhost:3210 --runs 3 --out ../cls.json

      - name: Sweep hero widths (diagnostic only)
        continue-on-error: true
        working-directory: reference-app
        env:
          BASE: http://localhost:3210
          PROBE: /probe/hero
          OUT: ../cls-widths.json
        run: node harness/clswidth.mjs ci

      - name: Measure the waterfall (diagnostic only)
        continue-on-error: true
        working-directory: reference-app
        run: node harness/waterfall.mjs --base http://localhost:3210 --label ci --runs 9

      - name: Check the gated report
        if: always() && hashFiles('cls.json') != ''
        id: check
        run: node scripts/check-cls.mjs cls.json cls-environment.json cls-widths.json cls-metrics.json cls-note.ndjson

      - name: Append compact CLS history to its git note
        if: always() && hashFiles('cls-metrics.json') != ''
        env:
          # Credentials reach only the note push, after the floating app's install and
          # build. The script passes the token per command, never through .git/config.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TSS_NOTES_NAMESPACE: cls
        run: ./scripts/write-note.sh cls-note.ndjson

      - name: Write job summary
        if: always()
        run: node scripts/write-cls-summary.mjs cls-metrics.json cls-environment.json cls-widths.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload CLS evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cls-evidence
          path: |
            cls.json
            cls-metrics.json
            cls-widths.json
            cls-environment.json
          if-no-files-found: warn
          retention-days: 30

      - name: Open or update the regression issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          THRESHOLD: ${{ env.THRESHOLD }}
        with:
          script: |
            const fs = require('fs')
            const title = 'Weekly CLS sweep failed'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const format = value => Number.isFinite(value) ? value.toFixed(4) : 'invalid'
            let body = `The weekly CLS sweep failed on \`${context.sha.slice(0, 8)}\`.\n\n[Run](${runUrl})\n\n`
            try {
              const m = JSON.parse(fs.readFileSync('cls-metrics.json', 'utf8'))
              if (m.worst) body += `Worst: **${m.worst.k} = ${format(m.worst.cls)}** (threshold ${m.threshold})\n\n`
              body += '| probe | runs | median CLS |\n|---|---|---:|\n'
              for (const r of m.rows) body += `| ${r.k} | ${(r.clsAll || []).map(format).join(', ')} | ${format(r.cls)} |\n`
              if (m.gate.errors.length) body += `\nGate errors:\n${m.gate.errors.map(e => `- ${e}`).join('\n')}\n`
            } catch {
              body += 'The job failed before producing gated measurements. Inspect the checkout, build, and sweep steps.\n'
            }
            try {
              const e = JSON.parse(fs.readFileSync('cls-environment.json', 'utf8'))
              body += `\nEnvironment: reference app \`${e.referenceAppSha}\`, ${e.runner.imageOS || e.runner.os} ${e.runner.imageVersion || ''}, Node ${e.runtime.node}, Puppeteer ${e.runtime.puppeteer}, ${e.runtime.browser}.\n`
            } catch {}
            body += '\nCheck the dedicated CLS trend before treating a single breach as a regression:\n'
            body += '```\ngit fetch origin "refs/notes/*:refs/notes/*" && git log --notes=cls\n```\n'

            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'cls-regression', per_page: 100,
            })
            const issue = open.find(item => !item.pull_request && item.title === title)
            if (issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['cls-regression'] })
            }

      - name: Close recovered regression issues
        if: success() && steps.check.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            const title = 'Weekly CLS sweep failed'
            const m = JSON.parse(fs.readFileSync('cls-metrics.json', 'utf8'))
            const e = JSON.parse(fs.readFileSync('cls-environment.json', 'utf8'))
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            let body = `Recovered after one fully passing weekly run on \`${context.sha.slice(0, 8)}\`.\n\n`
            body += `Worst gated result: **${m.worst.k} = ${m.worst.cls.toFixed(4)}** (threshold ${m.threshold}).\n`
            body += `Reference app: \`${e.referenceAppSha}\`; runner: ${e.runner.imageOS || e.runner.os} ${e.runner.imageVersion || ''}; browser: ${e.runtime.browser}.\n\n`
            body += `[Passing run](${runUrl})`

            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', labels: 'cls-regression', per_page: 100,
            })
            const matches = open.filter(item => !item.pull_request && item.title === title)
            for (const issue of matches) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body })
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed', state_reason: 'completed',
              })
            }
