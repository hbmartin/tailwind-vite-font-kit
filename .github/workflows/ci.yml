name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the notes job writes to the repo; everything else is read-only.
permissions:
  contents: read

concurrency:
  # Notes pushes serialise badly; one run per ref at a time.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Registry builds and is valid JSON
        run: |
          pnpm registry:build
          node -e "
            const d = require('./registry/r/fonts.json');
            if (d.type !== 'registry:base') throw new Error('unexpected type: ' + d.type);
            if (!d.devDependencies?.includes('tailwind-vite-font-kit')) throw new Error('missing devDependency');
            if (d.files[0].target !== '~/fonts.config.mjs') throw new Error('target must be project-root');
            console.log('registry ok');
          "
          # Fail if the committed registry output is stale.
          git diff --exit-code registry/r || {
            echo '::error::registry/r is out of date — run `pnpm registry:build` and commit.'
            exit 1
          }

      - name: Build fixture
        working-directory: test/fixture
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Collect metrics
        id: metrics
        run: |
          node scripts/collect-metrics.mjs test/fixture > metrics.json
          cat metrics.json

      - name: Assert invariants
        run: |
          node -e "
            const m = require('./metrics.json');
            const must = {
              googleapisRefs: 0, gstaticRefs: 0, blinkMacSystemFontLocals: 0,
              leakedThemeAtRule: 0, defaultFontFamilyIsVar: 1, themeVarsWithFallback: 2,
            };
            const bad = Object.entries(must).filter(([k, v]) => m[k] !== v);
            if (bad.length) {
              for (const [k, v] of bad) console.error(\`::error::\${k} = \${m[k]}, expected \${v}\`);
              process.exit(1);
            }
            if (m.fontFaceWithSizeAdjust < 8) {
              console.error('::error::too few metric-override faces: ' + m.fontFaceWithSizeAdjust);
              process.exit(1);
            }
            console.log('invariants ok');
          "

      - name: Job summary
        run: |
          {
            echo '### Font metrics'
            echo ''
            echo '| metric | value |'
            echo '|---|---|'
            node -e "
              const m = require('./metrics.json');
              for (const [k, v] of Object.entries(m)) console.log(\`| \${k} | \${v} |\`);
            "
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload metrics for the notes job
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: metrics
          path: metrics.json

  # Notes are per-commit, so PR runs would attach to a commit that may never land.
  # A separate job so `contents: write` is granted to nothing but the note push.
  notes:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: metrics

      - name: Write metrics to git notes
        run: ./scripts/write-note.sh metrics.json
